    | GET | `/medical_records/{id}/answers` | Danh sách câu trả lời của bệnh án | admin, doctor, patient |
    | PUT | `/medical_records/{id}/answers` | Lưu/cập nhật câu trả lời (upsert) | doctor, patient |
