    | GET | `/branches/{id}` | Chi tiết chi nhánh | admin, doctor |
    | PUT | `/branches/{id}` | Cập nhật chi nhánh | admin |
    | DELETE | `/branches/{id}` | Xoá chi nhánh | admin |
    | **Departments** | | | |
