    | GET | `/templates/{id}` | Chi tiết template (lồng section → question → option) | admin, doctor, patient |
    | PUT | `/templates/{id}` | Cập nhật template | admin |
    | DELETE | `/templates/{id}` | Xoá template | admin |
    | POST | `/templates/{template_id}/sections` | Thêm section | admin |
    | PUT | `/templates/sections/{id}` | Cập nhật section | admin |
    | DELETE | `/templates/sections/{id}` | Xoá section | admin |
    | POST | `/templates/sections/{section_id}/questions` | Thêm câu hỏi (kèm options) | admin |
    | PUT | `/templates/questions/{id}` | Cập nhật câu hỏi (upsert options) | admin |
    | DELETE | `/templates/questions/{id}` | Xoá câu hỏi | admin |
    | **Medical Records** | | | |
    | GET | `/medical_records/classify-questions` | Lấy bộ câu hỏi phân loại (chọn template) | doctor, patient |
    | POST | `/medical_records/classify` | Phân loại → template phù hợp | doctor, patient |
    | POST | `/medical_records` | Tạo bệnh án | doctor, patient |
    | GET | `/medical_records/all` | Danh sách bệnh án (bác sĩ/admin) | admin, doctor |
    | GET | `/medical_records/{id}` | Chi tiết bệnh án | admin, doctor, patient |
    | GET | `/medical_records/{id}/summary` | Tóm tắt bệnh án | admin, doctor, patient |
    | GET | `/medical_records/patients/{id}/history` | Lịch sử khám của bệnh nhân | admin, doctor, patient |
    | POST | `/medical_records/{id}/accept` | Bác sĩ nhận bệnh án | doctor |
    | PUT | `/medical_records/{id}` | Bác sĩ chốt bệnh án (completed) | doctor |
