paths:
  /auth/signup:
    post:
      tags: [Auth]
      summary: Đăng ký tài khoản bệnh nhân
      operationId: signup
      description: |-
        **API công khai** - không cần token.

        Tạo tài khoản mới với vai trò `patient` (mặc định). `is_active = 1`. Mật khẩu được băm (bcrypt).

        **Mã trả về (HTTP: code nghiệp vụ):**
        - **201**: 1001
        - **400**: 2001, 2002, 2004, 2007
        - **409**: 3006
        - **500**: 9901
        - **503**: 9902
      security: []
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SignupRequest'}}}
      responses:
        '201':
          description: Tạo thành công
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SignupResponse'}
              examples:
                success_1001:
                  summary: 1001 - Created successfully
                  value:
                    code: '1001'
                    message: Created successfully
                    data:
                      user_id: 15
                      full_name: Nguyễn Văn A
                      phone: '0912345678'
                      gender: male
                      role_id: 3
                      is_active: 1
                      created_at: '2026-10-08T09:30:00.000Z'
        '400': {$ref: '#/components/responses/E400_2001_2002_2004_2007'}
        '409': {$ref: '#/components/responses/E409_3006'}
        '500': {$ref: '#/components/responses/E500_9901'}
        '503': {$ref: '#/components/responses/E503_9902'}
  /auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập
      operationId: login
      description: |-
        **API công khai** - không cần token.

        Kiểm tra SĐT + mật khẩu. Tài khoản `is_active = 0` → `3010`. Trả JWT (có `jti`).

        **Mã trả về (HTTP: code nghiệp vụ):**
        - **200**: 1000
        - **400**: 2001, 2002, 2004, 2007
        - **401**: 3008
        - **403**: 3010
        - **404**: 3007
        - **500**: 9901
        - **503**: 9902
      security: []
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}}
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
              examples:
                success_1000:
                  summary: 1000 - OK
                  value:
                    code: '1000'
                    message: OK
                    data:
                      token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                      user_info: {user_id: 15, full_name: Nguyễn Văn A, phone: '0912345678', role_id: 3}
        '400': {$ref: '#/components/responses/E400_2001_2002_2004_2007'}
        '401': {$ref: '#/components/responses/E401_3008'}
        '403': {$ref: '#/components/responses/E403_3010'}
        '404': {$ref: '#/components/responses/E404_3007'}
        '500': {$ref: '#/components/responses/E500_9901'}
        '503': {$ref: '#/components/responses/E503_9902'}
  /auth/logout:
    post:
      tags: [Auth]
      summary: Đăng xuất
      operationId: logout
      description: |-
        **Quyền (RBAC):** `auth.session` - vai trò được cấp mặc định: admin, doctor, patient.

        Thêm `jti` của token hiện tại vào `token_blacklist` (kèm `expires_at` = `exp` của token).

        **Mã trả về (HTTP: code nghiệp vụ):**
        - **200**: 1000
        - **401**: 3001, 3002, 3003
        - **403**: 3101
        - **500**: 9901
        - **503**: 9902
      x-permission: auth.session
      x-roles: [admin, doctor, patient]
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmptyResponse'}
              examples: {success_1000: {summary: 1000 - OK, value: {code: '1000', message: OK, data: {}}}}
        '401': {$ref: '#/components/responses/E401_3001_3002_3003'}
        '403': {$ref: '#/components/responses/E403_3101'}
        '500': {$ref: '#/components/responses/E500_9901'}
        '503': {$ref: '#/components/responses/E503_9902'}
  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Quên mật khẩu - gửi OTP
      operationId: forgotPassword
      description: |-
        **API công khai** - không cần token.

        Sinh OTP 6 số, lưu **hash** vào `users.reset_token`, `reset_token_expires = now() + 10 phút`, gửi SMS. Dev: SMS mock, OTP in ra log và trả thêm `data.dev_otp` khi `NODE_ENV=development`.

        **Mã trả về (HTTP: code nghiệp vụ):**
        - **200**: 1000
        - **400**: 2001, 2002, 2004, 2007
        - **404**: 3007
        - **500**: 9901
        - **502**: 9903
        - **503**: 9902
      security: []
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ForgotPasswordRequest'}}}
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ForgotPasswordResponse'}
              examples:
                success_1000:
                  summary: 1000 - OTP has been sent to your phone
                  value:
                    code: '1000'
                    message: OTP has been sent to your phone
                    data: {expires_in: 600, dev_otp: '123456'}
        '400': {$ref: '#/components/responses/E400_2001_2002_2004_2007'}
        '404': {$ref: '#/components/responses/E404_3007'}
        '500': {$ref: '#/components/responses/E500_9901'}
        '502': {$ref: '#/components/responses/E502_9903'}
        '503': {$ref: '#/components/responses/E503_9902'}
  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Đặt lại mật khẩu bằng OTP
      operationId: resetPassword
      description: |-
        > **[BỔ SUNG]** API không có trong tài liệu gốc của thầy, nhóm tự thiết kế.

        **API công khai** - không cần token.

        Xác thực OTP rồi đặt mật khẩu mới. Thành công: xoá `reset_token`, cập nhật `password_changed_at`. Sai OTP quá 5 lần → huỷ OTP (phải gọi lại forgot-password).

        **Mã trả về (HTTP: code nghiệp vụ):**
        - **200**: 1000
        - **400**: 2001, 2002, 2003, 2004, 2007, 3004, 3005
        - **404**: 3007
        - **500**: 9901
        - **503**: 9902
      security: []
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ResetPasswordRequest'}}}
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmptyResponse'}
              examples: {success_1000: {summary: 1000 - OK, value: {code: '1000', message: OK, data: {}}}}
        '400': {$ref: '#/components/responses/E400_2001_2002_2003_2004_2007_3004_3005'}
        '404': {$ref: '#/components/responses/E404_3007'}
        '500': {$ref: '#/components/responses/E500_9901'}
        '503': {$ref: '#/components/responses/E503_9902'}
  /auth/change-password:
    put:
      tags: [Auth]
      summary: Đổi mật khẩu
      operationId: changePassword
      description: |-
        **Quyền (RBAC):** `auth.change_password` - vai trò được cấp mặc định: admin, doctor, patient.

        Sau khi đổi: cập nhật `password_changed_at` và đưa token hiện tại vào blacklist → phải đăng nhập lại.

        **Mã trả về (HTTP: code nghiệp vụ):**
        - **200**: 1000
        - **400**: 2001, 2002, 2003, 2007, 3009
        - **401**: 3001, 3002, 3003
        - **403**: 3101
        - **500**: 9901
        - **503**: 9902
      x-permission: auth.change_password
      x-roles: [admin, doctor, patient]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ChangePasswordRequest'}}}
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmptyResponse'}
              examples: {success_1000: {summary: 1000 - OK, value: {code: '1000', message: OK, data: {}}}}
        '400': {$ref: '#/components/responses/E400_2001_2002_2003_2007_3009'}
        '401': {$ref: '#/components/responses/E401_3001_3002_3003'}
        '403': {$ref: '#/components/responses/E403_3101'}
        '500': {$ref: '#/components/responses/E500_9901'}
        '503': {$ref: '#/components/responses/E503_9902'}
  /auth/admin/create-staff:
    post:
      tags: [Auth]
      summary: Admin tạo tài khoản nhân viên
      operationId: adminCreateStaff
      description: |-
        **Quyền (RBAC):** `auth.create_staff` - vai trò được cấp mặc định: admin.

        Tạo `users` + `staffs`. `department_id` phải thuộc `branch_id`; `room_id` (nếu có) phải thuộc `department_id` (sai → `2003`).

        **Mã trả về (HTTP: code nghiệp vụ):**
        - **201**: 1001
        - **400**: 2001, 2002, 2003, 2004, 2007
        - **401**: 3001, 3002, 3003
        - **403**: 3101, 3102
        - **409**: 3006
        - **500**: 9901
        - **503**: 9902
      x-permission: auth.create_staff
      x-roles: [admin]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AdminCreateStaffRequest'}}}
      responses:
        '201':
          description: Tạo thành công
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminCreateStaffResponse'}
              examples:
                success_1001:
                  summary: 1001 - Created successfully
                  value:
                    code: '1001'
                    message: Created successfully
                    data: {user_id: 8, full_name: BS. Trần Thị C, role_id: 2, branch_id: 1, department_id: 3}
        '400': {$ref: '#/components/responses/E400_2001_2002_2003_2004_2007'}
        '401': {$ref: '#/components/responses/E401_3001_3002_3003'}
        '403': {$ref: '#/components/responses/E403_3101_3102'}
        '409': {$ref: '#/components/responses/E409_3006'}
        '500': {$ref: '#/components/responses/E500_9901'}
        '503': {$ref: '#/components/responses/E503_9902'}
  /profile:
    get:
      tags: [Profile]
      summary: Xem hồ sơ cá nhân
      operationId: getProfile
      description: |-
        **Quyền (RBAC):** `profile.read` - vai trò được cấp mặc định: admin, doctor, patient.

        Bệnh nhân: trả thông tin hành chính từ `users` + `patients`. Nhân viên/Admin: các trường hành chính của bệnh nhân là `null`; có thêm `branch_id`, `department_id`, `room_id` nếu là nhân viên.

        **Mã trả về (HTTP: code nghiệp vụ):**
        - **200**: 1000
        - **401**: 3001, 3002, 3003
        - **403**: 3101
        - **404**: 3007
        - **500**: 9901
        - **503**: 9902
      x-permission: profile.read
      x-roles: [admin, doctor, patient]
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GetProfileResponse'}
              examples:
                success_1000:
                  summary: 1000 - OK
                  value:
                    code: '1000'
                    message: OK
                    data:
                      user_id: 15
                      full_name: Nguyễn Văn A
                      phone: '0912345678'
                      role_id: 3
                      gender: male
                      year_of_birth: 1995
                      career: Nhân viên văn phòng
                      ethnic: Kinh
                      hamlet_address: Số 5, ngõ 10
                      commune_address: Phường Bách Khoa
                      city_address: Hà Nội
                      work_place: Công ty ABC
                      health_insurance_number: DN4010123456789
                      health_insurance_validate: '2027-12-31'
                      next_of_kin_name: Nguyễn Văn B
                      next_of_kin_phone: '0912345679'
                      first_visit: '2026-10-01T08:00:00.000Z'
        '401': {$ref: '#/components/responses/E401_3001_3002_3003'}
        '403': {$ref: '#/components/responses/E403_3101'}
        '404': {$ref: '#/components/responses/E404_3007'}
        '500': {$ref: '#/components/responses/E500_9901'}
        '503': {$ref: '#/components/responses/E503_9902'}
    put:
      tags: [Profile]
      summary: Cập nhật hồ sơ cá nhân
      operationId: updateProfile
      description: |-
        **Quyền (RBAC):** `profile.update` - vai trò được cấp mặc định: admin, doctor, patient.

        Gửi **ít nhất 1 trường** (cập nhật từng phần). Không cho đổi `phone`, `role_id`. Sai kiểu (vd `year_of_birth` là chữ) → `2002`.

        **Mã trả về (HTTP: code nghiệp vụ):**
        - **200**: 1000
        - **400**: 2001, 2002, 2003, 2007
        - **401**: 3001, 3002, 3003
        - **403**: 3101
        - **404**: 3007
        - **500**: 9901
        - **503**: 9902
      x-permission: profile.update
      x-roles: [admin, doctor, patient]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UpdateProfileRequest'}}}
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GetProfileResponse'}
              examples:
                success_1000:
                  summary: 1000 - OK
                  value:
                    code: '1000'
                    message: OK
                    data:
                      user_id: 15
                      full_name: Nguyễn Văn A
                      phone: '0912345678'
                      role_id: 3
                      gender: male
                      year_of_birth: 1995
                      career: Giáo viên
                      ethnic: Kinh
                      hamlet_address: Số 5, ngõ 10
                      commune_address: Phường Bách Khoa
                      city_address: Hà Nội
                      work_place: Trường THPT X
                      health_insurance_number: DN4010123456789
                      health_insurance_validate: '2027-12-31'
                      next_of_kin_name: Nguyễn Văn B
                      next_of_kin_phone: '0912345679'
                      first_visit: '2026-10-01T08:00:00.000Z'
        '400': {$ref: '#/components/responses/E400_2001_2002_2003_2007'}
        '401': {$ref: '#/components/responses/E401_3001_3002_3003'}
        '403': {$ref: '#/components/responses/E403_3101'}
        '404': {$ref: '#/components/responses/E404_3007'}
        '500': {$ref: '#/components/responses/E500_9901'}
        '503': {$ref: '#/components/responses/E503_9902'}
  /admin/users:
    post:
      tags: [Admin - Users]
      summary: Admin tạo người dùng
      operationId: adminCreateUser
      description: |-
        **Quyền (RBAC):** `user.create` - vai trò được cấp mặc định: admin.

        Tạo tài khoản với `role_id` tuỳ chọn. Muốn tạo nhân viên gắn chi nhánh/khoa/phòng dùng `/auth/admin/create-staff` hoặc gọi thêm `/admin/users/{id}/assign`.

        **Mã trả về (HTTP: code nghiệp vụ):**
        - **201**: 1001
        - **400**: 2001, 2002, 2003, 2004, 2007
        - **401**: 3001, 3002, 3003
        - **403**: 3101, 3102
        - **409**: 3006
        - **500**: 9901
        - **503**: 9902
      x-permission: user.create
      x-roles: [admin]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AdminCreateUserRequest'}}}
      responses:
        '201':
          description: Tạo thành công
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminCreateUserResponse'}
              examples:
                success_1001:
                  summary: 1001 - Created successfully
                  value:
                    code: '1001'
                    message: Created successfully
                    data: {user_id: 16, full_name: Lê Văn D, phone: '0911222333', role_id: 3, is_active: 1}
        '400': {$ref: '#/components/responses/E400_2001_2002_2003_2004_2007'}
        '401': {$ref: '#/components/responses/E401_3001_3002_3003'}
        '403': {$ref: '#/components/responses/E403_3101_3102'}
        '409': {$ref: '#/components/responses/E409_3006'}
        '500': {$ref: '#/components/responses/E500_9901'}
        '503': {$ref: '#/components/responses/E503_9902'}
    get:
      tags: [Admin - Users]
      summary: Danh sách người dùng
      operationId: adminListUsers
      description: |-
        **Quyền (RBAC):** `user.list` - vai trò được cấp mặc định: admin.

        **Mã trả về (HTTP: code nghiệp vụ):**
        - **200**: 1000
        - **401**: 3001, 3002, 3003
        - **403**: 3101, 3102
        - **500**: 9901
        - **503**: 9902
      x-permission: user.list
      x-roles: [admin]
      parameters:
      - name: page
        in: query
        required: false
        description: Trang (bắt đầu từ 1).
        schema: {type: integer, default: 1, minimum: 1}
      - name: limit
        in: query
        required: false
        description: Số bản ghi mỗi trang.
        schema: {type: integer, default: 20, minimum: 1, maximum: 100}
      - name: role_id
        in: query
        required: false
        description: Lọc theo vai trò.
        schema: {type: integer, example: 3}
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminListUsersResponse'}
              examples:
                success_1000:
                  summary: 1000 - OK
                  value:
                    code: '1000'
                    message: OK
                    data: [{user_id: 15, full_name: Nguyễn Văn A, phone: '0912345678', role_id: 3, is_active: 1}]
                    total: 57
                    page: 1
                    limit: 20
        '401': {$ref: '#/components/responses/E401_3001_3002_3003'}
        '403': {$ref: '#/components/responses/E403_3101_3102'}
        '500': {$ref: '#/components/responses/E500_9901'}
        '503': {$ref: '#/components/responses/E503_9902'}
  /admin/users/{id}:
    get:
      tags: [Admin - Users]
      summary: Chi tiết người dùng
      operationId: adminGetUser
      description: |-
        **Quyền (RBAC):** `user.read` - vai trò được cấp mặc định: admin.

        Bệnh nhân → object `Profile`; nhân viên → object `StaffInfo` (có branch/department/room).

        **Mã trả về (HTTP: code nghiệp vụ):**
        - **200**: 1000
        - **401**: 3001, 3002, 3003
        - **403**: 3101, 3102
        - **404**: 3007
        - **500**: 9901
        - **503**: 9902
      x-permission: user.read
      x-roles: [admin]
      parameters:
      - name: id
        in: path
        required: true
        description: user_id
        schema: {type: integer, example: 15}
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminGetUserResponse'}
              examples:
                success_1000:
                  summary: 1000 - OK
                  value:
                    code: '1000'
                    message: OK
                    data:
                      user_id: 15
                      full_name: Nguyễn Văn A
                      phone: '0912345678'
                      role_id: 3
                      gender: male
                      year_of_birth: 1995
                      career: Nhân viên văn phòng
                      ethnic: Kinh
                      hamlet_address: Số 5, ngõ 10
                      commune_address: Phường Bách Khoa
                      city_address: Hà Nội
                      work_place: Công ty ABC
                      health_insurance_number: DN4010123456789
                      health_insurance_validate: '2027-12-31'
                      next_of_kin_name: Nguyễn Văn B
                      next_of_kin_phone: '0912345679'
                      first_visit: '2026-10-01T08:00:00.000Z'
                staff:
                  summary: Chi tiết nhân viên
                  value:
                    code: '1000'
                    message: OK
                    data:
                      user_id: 8
                      full_name: BS. Trần Thị C
                      phone: '0987654321'
                      role_id: 2
                      gender: female
                      is_active: 1
                      branch_id: 1
                      department_id: 3
                      room_id: 7
        '401': {$ref: '#/components/responses/E401_3001_3002_3003'}
        '403': {$ref: '#/components/responses/E403_3101_3102'}
        '404': {$ref: '#/components/responses/E404_3007'}
        '500': {$ref: '#/components/responses/E500_9901'}
        '503': {$ref: '#/components/responses/E503_9902'}
    put:
      tags: [Admin - Users]
      summary: Cập nhật người dùng (khoá/mở, đổi vai trò)
      operationId: adminUpdateUser
      description: |-
        **Quyền (RBAC):** `user.update` - vai trò được cấp mặc định: admin.

        Gửi ít nhất 1 trường. `is_active = 0` để khoá tài khoản. Bệnh nhân → object `Profile`; nhân viên → object `StaffInfo` (có branch/department/room).

        **Mã trả về (HTTP: code nghiệp vụ):**
