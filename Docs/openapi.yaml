    | GET | `/lesion-episodes/record/{medical_record_id}` | Đợt tổn thương theo bệnh án (bác sĩ) *(bổ sung)* | admin, doctor |
    | GET | `/lesion-episodes/{id}` | Chi tiết đợt tổn thương | admin, doctor, patient |
    | PATCH | `/lesion-episodes/{id}` | Cập nhật đợt tổn thương | patient |
    | DELETE | `/lesion-episodes/{id}` | Xoá đợt tổn thương | patient |
