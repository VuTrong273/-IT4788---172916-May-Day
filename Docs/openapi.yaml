openapi: '3.0.3'
info:
  title: May Day API
  version: '1.0.0'
  description: |
    Tài liệu API **duy nhất cần đọc khi lập trình** hệ thống quản lý mề đay **May Day** (IT4788).
    Đã gộp toàn bộ nội dung cần thiết từ `Slide APIs` (SLIDE 1-11 + `api.xlsx`): mọi endpoint, request, response, và **mọi mã `BaseResponse` có thể trả về của từng endpoint** (xem mục *examples* của từng response).

    Trong mỗi endpoint:
    - Mỗi **HTTP status** là một mục trong `responses`; trong đó mỗi **code nghiệp vụ** là một mục trong `examples`.
    - Cuối phần `description` của mỗi endpoint có danh sách **"Mã trả về"** (HTTP → các code) để xem nhanh.
    - Response lỗi dùng chung nằm ở `components/responses/E<http>_<code>_<code>...` (tên chính là danh sách code, vd `E400_2001_2002_2004`); mỗi code trỏ tới `components/examples/R<code>`. Swagger UI/Redoc hiển thị đầy đủ ngay dưới endpoint.
    - Request/response thành công nằm ở `components/schemas` với tên `<OperationId>Request` / `<OperationId>Response`.
    - Endpoint đánh dấu **[BỔ SUNG]** là API nhóm tự thiết kế (không có trong tài liệu gốc của thầy).

    ## Mục lục API
    | Method | Path | Mô tả | Vai trò mặc định |
    |---|---|---|---|
    | **Auth** | | | |
    | POST | `/auth/signup` | Đăng ký tài khoản bệnh nhân | công khai |
    | POST | `/auth/login` | Đăng nhập | công khai |
    | POST | `/auth/logout` | Đăng xuất | admin, doctor, patient |
    | POST | `/auth/forgot-password` | Quên mật khẩu - gửi OTP | công khai |
    | POST | `/auth/reset-password` | Đặt lại mật khẩu bằng OTP *(bổ sung)* | công khai |
    | PUT | `/auth/change-password` | Đổi mật khẩu | admin, doctor, patient |
    | POST | `/auth/admin/create-staff` | Admin tạo tài khoản nhân viên | admin |
    | **Profile** | | | |
    | GET | `/profile` | Xem hồ sơ cá nhân | admin, doctor, patient |
    | PUT | `/profile` | Cập nhật hồ sơ cá nhân | admin, doctor, patient |
    | **Admin - Users** | | | |
    | POST | `/admin/users` | Admin tạo người dùng | admin |
    | GET | `/admin/users` | Danh sách người dùng | admin |
    | GET | `/admin/users/{id}` | Chi tiết người dùng | admin |
    | PUT | `/admin/users/{id}` | Cập nhật người dùng (khoá/mở, đổi vai trò) | admin |
    | DELETE | `/admin/users/{id}` | Xoá người dùng | admin |
    | PUT | `/admin/users/{id}/assign` | Gán nhân viên vào chi nhánh/khoa/phòng | admin |
    | **RBAC - Roles** | | | |
    | POST | `/roles` | Tạo vai trò | admin |
    | GET | `/roles` | Danh sách vai trò | admin |
    | PUT | `/roles/{id}` | Cập nhật vai trò *(bổ sung)* | admin |
    | DELETE | `/roles/{id}` | Xoá vai trò *(bổ sung)* | admin |
