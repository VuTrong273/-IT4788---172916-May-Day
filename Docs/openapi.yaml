                        test_name: Công thức máu
                        result_id: '3'
                        result_value: WBC 7.2 G/L; EO 6%
                        concluded_by: '8'
                        result_note: Bạch cầu ái toan tăng nhẹ
                      created_at: '2026-10-08T09:30:00.000Z'
        '400': {$ref: '#/components/responses/E400_2001_2002_2003_2007'}
        '401': {$ref: '#/components/responses/E401_3001_3002_3003'}
        '403': {$ref: '#/components/responses/E403_3101_3103_3105'}
        '404': {$ref: '#/components/responses/E404_8103'}
        '500': {$ref: '#/components/responses/E500_9901'}
        '503': {$ref: '#/components/responses/E503_9902'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Header `Authorization: Bearer <token>`. Token lấy từ /auth/login.'
  schemas:
    BaseResponse:
      type: object
      required: [code, message, data]
      description: Vỏ bọc chung của MỌI response (thành công lẫn lỗi). `code` luôn là chuỗi.
      properties:
        code: {type: string, description: Mã nghiệp vụ (xem bảng mã ở phần mô tả API)., example: '1000'}
        message: {type: string, description: Thông điệp mô tả., example: OK}
        data: {description: 'Payload (object hoặc array). Khi lỗi luôn là `{}`.', example: {}}
    ErrorResponse:
      allOf:
      - {$ref: '#/components/schemas/BaseResponse'}
      - type: object
        properties: {data: {type: object, description: 'Luôn là `{}` khi lỗi.', example: {}}}
    Role:
      type: object
      properties:
        id: {type: integer, example: 2}
        name: {type: string, example: doctor}
        description: {type: string, nullable: true, example: Bác sĩ}
        parent_role_id: {type: integer, description: Vai trò cha (kế thừa)., nullable: true}
        created_at: {type: string, format: date-time, example: '2026-10-08T09:30:00.000Z'}
        updated_at: {type: string, format: date-time, example: '2026-10-08T09:30:00.000Z'}
      required: [id, name]
    Permission:
      type: object
      properties:
        id: {type: integer, example: 5}
        name: {type: string, example: medical_record.accept}
        description: {type: string, nullable: true, example: Nhận bệnh án}
        created_at: {type: string, format: date-time, example: '2026-10-08T09:30:00.000Z'}
        updated_at: {type: string, format: date-time, example: '2026-10-08T09:30:00.000Z'}
      required: [id, name]
    ApiEndpoint:
      type: object
      properties:
        id: {type: integer, example: 12}
        name: {type: string, example: acceptMedicalRecord}
        method: {type: string, enum: [GET, POST, PUT, PATCH, DELETE], example: POST}
        path:
          type: string
          description: Pattern đường dẫn đầy đủ, tham số dạng `:name`.
          example: /api/v1/medical_records/:id/accept
        description: {type: string, nullable: true, example: Bác sĩ nhận bệnh án}
        is_public:
          type: integer
          description: 1 = API công khai, bỏ qua kiểm tra quyền.
          enum: [0, 1]
          example: 0
        created_at: {type: string, format: date-time, example: '2026-10-08T09:30:00.000Z'}
        updated_at: {type: string, format: date-time, example: '2026-10-08T09:30:00.000Z'}
      required: [id, name, method, path]
    Branch:
      type: object
      properties:
        id: {type: integer, example: 1}
        name: {type: string, example: Cơ sở Hà Nội}
        address: {type: string, example: '1 Đại Cồ Việt, Hai Bà Trưng, Hà Nội'}
        phone: {type: string, example: 0243869xxxx}
        created_at: {type: string, format: date-time, example: '2026-10-08T09:30:00.000Z'}
        updated_at: {type: string, format: date-time, example: '2026-10-08T09:30:00.000Z'}
      required: [id, name]
    Department:
      type: object
      properties:
        id: {type: integer, example: 3}
        name: {type: string, example: Khoa Da liễu}
        description: {type: string, nullable: true, example: Khám và điều trị bệnh da}
        branch_id: {type: integer, example: 1}
        created_at: {type: string, format: date-time, example: '2026-10-08T09:30:00.000Z'}
        updated_at: {type: string, format: date-time, example: '2026-10-08T09:30:00.000Z'}
      required: [id, name, branch_id]
    Room:
      type: object
      properties:
        id: {type: integer, example: 7}
        name: {type: string, example: Phòng khám 101}
        description: {type: string, nullable: true, example: Tầng 1}
        department_id: {type: integer, description: NULL nếu khoa đã bị xoá., nullable: true, example: 3}
        created_at: {type: string, format: date-time, example: '2026-10-08T09:30:00.000Z'}
        updated_at: {type: string, format: date-time, example: '2026-10-08T09:30:00.000Z'}
      required: [id, name]
    Profile:
      type: object
      properties:
        user_id: {type: integer, example: 15}
        full_name: {type: string, example: Nguyễn Văn A}
        phone: {type: string, example: '0912345678'}
        role_id: {type: integer, example: 3}
        gender: {type: string, enum: [male, female, other], nullable: true, example: male}
        year_of_birth: {type: integer, nullable: true, example: 1995}
        career: {type: string, nullable: true, example: Nhân viên văn phòng}
        ethnic: {type: string, nullable: true, example: Kinh}
        hamlet_address: {type: string, description: Thôn/xóm/số nhà., nullable: true, example: 'Số 5, ngõ 10'}
        commune_address: {type: string, description: Xã/phường., nullable: true, example: Phường Bách Khoa}
        city_address: {type: string, description: Tỉnh/thành phố., nullable: true, example: Hà Nội}
        work_place: {type: string, nullable: true, example: Công ty ABC}
        health_insurance_number: {type: string, nullable: true, example: DN4010123456789}
        health_insurance_validate:
          type: string
          format: date
          description: Hạn thẻ BHYT.
          nullable: true
          example: '2027-12-31'
        next_of_kin_name: {type: string, description: Người thân liên hệ., nullable: true, example: Nguyễn Văn B}
        next_of_kin_phone: {type: string, nullable: true, example: '0912345678'}
        first_visit:
          type: string
          format: date-time
          description: Lần khám đầu tiên.
          nullable: true
          example: '2026-10-01T08:00:00.000Z'
      required: [user_id, full_name, phone, role_id]
    StaffInfo:
      type: object
      properties:
        user_id: {type: integer, example: 8}
        full_name: {type: string, example: BS. Trần Thị C}
        phone: {type: string, example: '0987654321'}
        role_id: {type: integer, example: 2}
        gender: {type: string, enum: [male, female, other], nullable: true, example: female}
        is_active: {type: integer, enum: [0, 1], example: 1}
        branch_id: {type: integer, nullable: true, example: 1}
        department_id: {type: integer, nullable: true, example: 3}
        room_id: {type: integer, nullable: true, example: 7}
      required: [user_id, full_name, phone, role_id]
    UserListItem:
      type: object
      properties:
        user_id: {type: integer, example: 15}
        full_name: {type: string, example: Nguyễn Văn A}
        phone: {type: string, example: '0912345678'}
        role_id: {type: integer, example: 3}
        is_active: {type: integer, enum: [0, 1], example: 1}
      required: [user_id, full_name, phone, role_id, is_active]
    OptionInput:
      type: object
      properties:
        option_text: {type: string, example: Có}
        option_value: {type: string, example: 'yes'}
        order: {type: integer, default: 0, example: 1}
        trigger_image_upload:
          type: integer
          description: 1 = chọn lựa chọn này sẽ yêu cầu upload ảnh.
          enum: [0, 1]
          default: 0
          example: 0
      required: [option_text, option_value]
    Option:
      type: object
      properties:
        id: {type: integer, example: 101}
        option_text: {type: string, example: Có}
        option_value: {type: string, example: 'yes'}
        order: {type: integer, example: 1}
        trigger_image_upload: {type: integer, enum: [0, 1], example: 0}
      required: [id, option_text, option_value]
    Question:
      type: object
      properties:
        question_id:
          type: string
          description: Mã câu hỏi (client đặt, duy nhất toàn hệ thống).
          example: Q_ITCH
        question_text: {type: string, example: 'Bạn có bị ngứa không?'}
        type_question:
          type: string
          description: '`image` = Image Upload.'
          enum: [text, textarea, number, date, radio, checkbox, select, image]
          example: radio
        placeholder: {type: string, nullable: true}
        help_text: {type: string, nullable: true}
        order: {type: integer, example: 1}
        is_required: {type: integer, enum: [0, 1], example: 1}
        allow_image: {type: integer, enum: [0, 1], example: 0}
        parent_question_id: {type: string, nullable: true}
        show_if_answer:
          type: string
          description: Chuỗi JSON điều kiện hiển thị, vd `{"Q_PARENT":["yes"]}`.
          nullable: true
        condition_rules: {type: string, description: Chuỗi JSON quy tắc phụ., nullable: true}
        options: {type: array, items: {$ref: '#/components/schemas/Option'}}
      required: [question_id, question_text, type_question]
    Section:
      type: object
      properties:
        section_id: {type: integer, example: 4}
        title: {type: string, example: Thông tin triệu chứng}
        order: {type: integer, example: 1}
        is_required: {type: integer, enum: [0, 1], example: 1}
        filled_by:
          type: string
          description: 'Ai điền: bệnh nhân / bác sĩ / cả hai.'
          enum: [patient, doctor, patdoc]
          example: patient
        questions: {type: array, items: {$ref: '#/components/schemas/Question'}}
      required: [section_id, title]
    TemplateSummary:
      type: object
      properties:
        code_template: {type: string, example: TPL_CHRONIC_V1}
        name: {type: string, example: Mề đay mạn tính}
        description: {type: string, nullable: true, example: Form khám mề đay mạn}
        version: {type: string, example: '1.0'}
        is_active: {type: string, description: '`"1"` / `"0"`.', enum: ['1', '0'], example: '1'}
        created_at: {type: string, format: date-time, example: '2026-10-08T09:30:00.000Z'}
      required: [code_template, name]
    TemplateDetail:
      type: object
      properties:
        code_template: {type: string, example: TPL_CHRONIC_V1}
        name: {type: string, example: Mề đay mạn tính}
        description: {type: string, nullable: true}
        version: {type: string, example: '1.0'}
        is_active: {type: string, enum: ['1', '0'], example: '1'}
        sections: {type: array, items: {$ref: '#/components/schemas/Section'}}
      required: [code_template, name, sections]
    MedicalRecord:
      type: object
      properties:
        medical_record_id: {type: integer, example: 101}
        patient_id: {type: integer, example: 15}
        assigned_doctor_id: {type: integer, description: NULL khi chưa có bác sĩ nhận., nullable: true, example: 8}
        created_by: {type: integer, description: NULL nếu người tạo đã bị xoá., nullable: true, example: 15}
        template_id: {type: string, description: = code_template., example: TPL_CHRONIC_V1}
        status: {type: string, enum: [pending, in_progress, completed], example: in_progress}
        instructions: {type: string, description: Lời dặn của bác sĩ., nullable: true}
        completed_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time, example: '2026-10-08T09:30:00.000Z'}
        updated_at: {type: string, format: date-time, example: '2026-10-08T09:30:00.000Z'}
      required: [medical_record_id, patient_id, template_id, status]
    MedicalRecordListItem:
      type: object
      properties:
        medical_record_id: {type: integer, example: 101}
        patient_id: {type: integer, example: 15}
        assigned_doctor_id: {type: integer, nullable: true}
