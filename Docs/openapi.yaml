    | GET | `/lab-results/{record_id}` | Xem chỉ định & kết quả xét nghiệm của bệnh án | admin, doctor, patient |
    | POST | `/lab-results` | Bác sĩ nhập kết quả xét nghiệm *(bổ sung)* | doctor |

    ## 1. Quy ước chung

    | Mục | Quy ước |
    |---|---|
    | Base URL | `/api/v1` |
    | Xác thực | `Authorization: Bearer <JWT>` (trừ API công khai). JWT chứa `sub` (user_id), `role_id`, `jti`, `iat`, `exp`. |
    | Content-Type | `application/json`; upload ảnh dùng `multipart/form-data`. |
    | Vỏ response | `{ "code": "<string>", "message": "<string>", "data": <object/array> }`. Lỗi: `data = {}`. |
    | Phân trang | Query `page` (mặc định 1), `limit` (mặc định 20, tối đa 100). Các trường siêu dữ liệu (`total`, `page`, `limit`) nằm **ngoài `data`**, cùng cấp với `code/message/data`. |
    | Thời gian | ISO 8601 UTC (`2026-10-08T09:30:00.000Z`); ngày `YYYY-MM-DD`. |
    | Cờ boolean | Số `0/1` (hoặc chuỗi `"1"/"0"` ở `templates.is_active`) đúng như spec gốc. |
    | Tên trường | Dùng `full_name` (file xlsx gốc gõ nhầm `ffull_name`), `old_password / new_password / confirm_password`. |

    ### Kiểu dữ liệu "id dạng chuỗi"
    Spec gốc quy định các module **Lesion (episode/location/photo), UAS7, Prescription, Lab, Image attachment** trả id và số dưới dạng **chuỗi** (ví dụ `"episode_id": "12"`, `"iss7": "2"`). Các schema ở dưới đã đánh dấu rõ. Backend nên **chấp nhận cả số lẫn chuỗi số ở request**, nhưng **luôn trả chuỗi ở response** cho các module này. Các module còn lại dùng số nguyên.

    ### Quy ước UAS7 (Decision D5 - khác slide)
    Slide gốc ghi ISS7 = số lượng mề đay, HSS7 = ngứa. **Nhóm dùng chuẩn y khoa**: **`iss7` = điểm NGỨA (0-3)**, **`hss7` = điểm SỐ LƯỢNG MỀ ĐAY (0-3)**. `daily_score = iss7 + hss7` (0-6); tổng tuần 0-42.
    5 mức độ: `0` Không hoạt động · `1-6` Nhẹ · `7-15` Vừa · `16-27` Nặng · `28-42` Rất nặng.

    ### Vòng đời bệnh án (Decision D4)
    `pending` → (bác sĩ `accept`) → `in_progress` → (bác sĩ `PUT` + `status=completed`) → `completed`. Bệnh án `completed` **bị khoá**: không sửa câu trả lời, không thêm đợt tổn thương (lỗi 4003).

    ## 2. Xác thực & phân quyền động (RBAC)
    1. Mỗi request: kiểm tra JWT (chữ ký, `exp`, `jti` không có trong `token_blacklist`, `iat >= users.password_changed_at`, `users.is_active = 1`) → lỗi `3001/3002/3003`, tài khoản bị khoá `3010`.
    2. Tra `(method, path)` trong bảng `api_endpoints`. Nếu `is_public = 1` → cho qua. Nếu không: role của user phải có một `permission` (bảng `role_permissions`) được gán cho endpoint đó (bảng `permissions_endpoints`) → nếu không: `3101`.
    3. Các endpoint dành riêng một vai trò trả `3102` (Admin) / `3103` (Doctor) / `3104` (Patient) thay cho `3101` (đúng như test case của thầy).
    4. Kiểm tra **quyền sở hữu dữ liệu** trong code: bệnh nhân chỉ xem dữ liệu của mình (`3106`); bác sĩ chỉ thao tác bệnh án mình được phân công (`3105`).
    5. Seed quyền mặc định: `Database/001_Seed_RBAC.sql` (sinh từ chính file này; mỗi operation có `x-permission`, `x-roles`).

    ## 3. Đăng nhập & mật khẩu
    - Đăng ký (`/auth/signup`) luôn tạo **bệnh nhân** (`role_id` = role `patient`). Nhân viên do Admin tạo (`/auth/admin/create-staff`).
    - Quên mật khẩu: `/auth/forgot-password` sinh OTP 6 số, **lưu hash** vào `users.reset_token`, hết hạn sau **10 phút** (`3005`). Ở môi trường **dev**, SMS được mock: OTP in ra log server và trả thêm `data.dev_otp` (chỉ khi `NODE_ENV=development`). Sau đó gọi `/auth/reset-password`. Sai OTP quá 5 lần → huỷ OTP.
    - Đổi mật khẩu thành công: cập nhật `users.password_changed_at`, mọi token cũ mất hiệu lực.
    - Số điện thoại hợp lệ: 10 số, đầu `03, 05, 07, 08, 09` (lỗi `2004`).

    ## 4. Ảnh (MinIO/S3)
    - Định dạng `jpg, jpeg, png, webp`; tối đa **5 MB/ảnh**; upload nhiều: tối đa **10 ảnh/lần** (`6004`).
    - DB chỉ lưu metadata (`media_attachments`); file thật nằm ở bucket MinIO. Lỗi MinIO → `6007`.
    - Xoá ảnh: xoá object trên MinIO, đồng thời `answer_images` và `lesion_photos` liên quan bị xoá theo (CASCADE).

    ## 5. Quy tắc xoá (slide 3.6)
    - **RESTRICT** (lỗi `2003`): xoá chi nhánh/khoa/phòng khi còn nhân viên hoặc khoa trực thuộc; xoá template đang có bệnh án → `4105`; xoá bệnh nhân đã có bệnh án.
    - **SET NULL**: xoá khoa → `rooms.department_id = NULL`; xoá nhân viên → `medical_records.assigned_doctor_id/created_by = NULL`; xoá bệnh án → `media_attachments.medical_record_id = NULL`.
    - **CASCADE**: template → sections → questions → options; user → token_blacklist; role/permission → role_permissions; bệnh án → answers, đợt tổn thương, UAS7, đơn thuốc, chỉ định xét nghiệm.

    ## 6. Phạm vi KHÔNG làm
    AI dự đoán ảnh (`/ai/predict-image`), thông báo/FCM, bảng gộp mã 9992... trong xlsx. Mã `9001-9003`, `9101-9102` không dùng. API xem ảnh dạng binary không cần token và API gắn/ghi hàng loạt ảnh vào câu trả lời của xlsx cũng được bỏ (dùng `file_url` và API đơn lẻ).

