    | GET | `/role_permissions/role/{role_id}` | Xem quyền của vai trò | admin |
    | DELETE | `/role_permissions/role/{role_id}/permission/{permission_id}` | Thu hồi 1 quyền khỏi vai trò | admin |
    | **RBAC - API Endpoints** | | | |
    | POST | `/api_endpoints` | Đăng ký API vào danh mục *(bổ sung)* | admin |
    | GET | `/api_endpoints` | Danh sách API trong danh mục *(bổ sung)* | admin |
    | PUT | `/api_endpoints/{id}` | Cập nhật API trong danh mục *(bổ sung)* | admin |
    | DELETE | `/api_endpoints/{id}` | Xoá API khỏi danh mục *(bổ sung)* | admin |
