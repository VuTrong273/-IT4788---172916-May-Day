      operationId: enterLabResults
      description: |-
        > **[BỔ SUNG]** API không có trong tài liệu gốc của thầy, nhóm tự thiết kế.

        **Quyền (RBAC):** `lab_result.write` - vai trò được cấp mặc định: doctor.

        Yêu cầu bắt buộc của thầy: *nhập kết quả xét nghiệm*. Ghi kết quả cho từng item của một phiếu chỉ định; item đã có kết quả thì **ghi đè** (upsert theo `lab_request_item_id`). Item không thuộc phiếu → `2003`. Sau khi ghi: có ít nhất 1 kết quả → `in_progress`; mọi item đều có kết quả → `completed`. Chỉ bác sĩ phụ trách bệnh án (`3105`).

        **Mã trả về (HTTP: code nghiệp vụ):**
        - **201**: 1001
        - **400**: 2001, 2002, 2003, 2007
        - **401**: 3001, 3002, 3003
        - **403**: 3101, 3103, 3105
        - **404**: 8103
        - **500**: 9901
        - **503**: 9902
